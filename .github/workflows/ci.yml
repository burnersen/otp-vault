# otp-vault (https://github.com/burnersen/otp-vault)
# Copyright (C) 2026 burnersen
# SPDX-License-Identifier: GPL-3.0-only
#
# Checks every push and pull request. Nothing is published here.
#
# Linux runs the Go tests (the logic in app.go is platform neutral) and the
# checks of the page script, which need no browser. Windows then builds the
# real window once and keeps it as a test build for two weeks.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # tags and history for the release notes check
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # The release stops without .github/release-notes/<version>.md. Found
      # here on every push, not only when the release is started.
      - name: release notes for the next version
        run: bash .github/check-release-notes.sh

      # gofmt -l only lists offenders and exits 0; turning its output into
      # the verdict is the point of this step.
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "::error::not gofmt-clean:"; echo "$unformatted"; exit 1; fi

      - name: go vet (Linux, Windows x64, Windows ARM64)
        run: |
          go vet ./...
          GOOS=windows GOARCH=amd64 go vet ./...
          GOOS=windows GOARCH=arm64 go vet ./...

      - name: go test
        run: go test -race -count=1 ./...

      # Built with the toolchain from go.mod: an older govulncheck cannot
      # read newer sources.
      - name: govulncheck
        run: |
          GOTOOLCHAIN=local go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          GOOS=windows govulncheck ./...

      # The page's own script, checked without a browser. An empty list would
      # pass while checking nothing, so it fails instead.
      - name: page checks
        run: |
          shopt -s nullglob
          checks=(frontend/*_check.js)
          if [ ${#checks[@]} -eq 0 ]; then echo "::error::no page checks found"; exit 1; fi
          for f in frontend/dist/*.js; do node --check "$f"; done
          for c in "${checks[@]}"; do echo "--- $c"; node "$c"; done

  windows:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: go test (native Windows)
        run: go test -count=1 ./...
      - name: build the window
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.1
          wails build -platform windows/amd64 -skipbindings -trimpath
      # The window must open, load the page and reach Go: in the self test
      # the page reports ready and the window closes with 0. If it hangs (on
      # a message box, a script error in the page), the step fails after a
      # minute. The data goes to a throwaway folder (OTP_VAULT_HOME).
      - name: start the window once
        shell: pwsh
        run: |
          $env:OTP_VAULT_HOME = Join-Path $env:RUNNER_TEMP "otpv-selftest"
          $p = Start-Process -FilePath ./build/bin/otp-vault.exe -ArgumentList '-selftest' -PassThru
          if (-not $p.WaitForExit(60000)) { $p.Kill(); Write-Host "::error::the window did not report ready"; Get-Content "$env:OTP_VAULT_HOME/logs/otp-vault.log" -ErrorAction SilentlyContinue; exit 1 }
          if ($p.ExitCode -ne 0) { Write-Host "::error::exit code $($p.ExitCode)"; exit 1 }
          Get-Content "$env:OTP_VAULT_HOME/logs/otp-vault.log"
          if (-not (Select-String -Path "$env:OTP_VAULT_HOME/logs/otp-vault.log" -Pattern "self test passed" -Quiet)) { Write-Host "::error::the page never reached Go"; exit 1 }
          Write-Host "Window started, page loaded, Go reached."
      # A test build to try out, from the run's summary page. Not a release:
      # unsigned and without a version number.
      - uses: actions/upload-artifact@v7
        with:
          name: otp-vault-test-build-x64
          path: build/bin/otp-vault.exe
          retention-days: 14
